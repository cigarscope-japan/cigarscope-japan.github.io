# CigarScope Japan 除外レジストリ（AUDIT-STANDARD-DESIGN.md 基準7「除外ソースの扱い」）
# 編集方針による除外は信頼度（T1〜T5）の判定とは別の判断であり、このファイルに分離して記録する。
# 除外は「その媒体が不正確だ」という判定ではない。
#
# 2026-11-08 の登録では、カズの指示（日本のシガージャーナル＝シガーナビを指していた）を
# 国際誌 Cigar Journal (cigarjournal.com) と取り違えて登録していた。2026-11-09 にカズ本人が訂正：
# 「シガージャーナルは記事を使ってもいい。ダメな奴は五十嵐のシガーナビ」「シガーナビだけは絶対使うな」。
# よって Cigar Journal は通常の情報源として使用可に戻し、除外対象は CigarNavi に差し替えた。
exclusions:
- name: CigarNavi（シガーナビ）
domain: cigarnavi.jp
handles:
- '@CigarNavi（X）'
decided_by: カズ
date: '2026-11-09'
reason: 五十嵐達哉氏が編集にあたるメディアであり、カズ／CigarScope Japan と敵対関係にあるため。情報源・デザイン参照のいずれにも使用しない。
scope:
- 情報源として除外（引用・転載・要約・事実認定の根拠のいずれにも用いない）
- デザイン参照として除外
notes: 五十嵐氏関連の出版物・メディアに紐づく話題そのものの除外（従来方針）と一体で運用する。見直しは編集者の再決定があった場合のみ。
