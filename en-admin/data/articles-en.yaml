- slug: el-tigre-factory
  title: Drew Estate Plans to Move El Tigre Dominicano Production to a New Dominican
    Factory
  summary: The line is currently made at La Gran Fábrica Drew Estate in Nicaragua;
    production is expected to shift when the company's upcoming Dominican factory
    opens next year.
  description: Drew Estate has said it plans to move Undercrown El Tigre Dominicano
    production from Nicaragua to a Dominican factory it expects to open next year.
