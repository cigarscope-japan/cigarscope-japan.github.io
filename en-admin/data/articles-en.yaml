  title: Drew Estate Puts Ten Blends in the Feral Flying Pig Shape
  summary: A ten-cigar collection gathers eight first-time Feral Flying Pig releases
    at $170, while a separate box-pressed El Tigre Dominicano Flying Pig appears to
    be a retail first.
  description: Drew Estate's Feral Flying Pig Collection puts ten blends in the 5
    3/8 x 60 Feral vitola for $170; eight are new in the size, and a box-pressed El
    Tigre Dominicano Flying Pig is sold separately.
