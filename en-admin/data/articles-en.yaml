- slug: bvi-habanos
  title: BVI Court Move Could Return Chen Zhi's Habanos Stake to His Companies
  summary: Tobacco Reporter says a BVI High Court decision could restore control over
    entities tied to a 28.55% interest in Habanos — while Chen denies the allegations
    and separate U.S. and EU measures continue.
  description: A British Virgin Islands court has ruled that winding-up orders over
    more than 30 Chen Zhi-linked entities should be lifted, Tobacco Reporter reports;
    the stake chain leads to 50% of Habanos S.A.
  category: market
  country_ids:
  - cuba
  maker_id: habanos
  source_name: Tobacco Reporter
  source_url: https://tobaccoreporter.com/2026/11/06/court-returns-control-of-habanos-s-a-to-chen-zhi/
