- slug: fifth-avenue
  title: 5th Avenue's Insolvency Leaves Habanos Distribution in Three European Markets
    in Limbo
  summary: The Habanos distributor for Germany, Austria and Poland entered formal
    insolvency on Nov. 1, weeks after EU sanctions left it unable to fulfil orders,
    Halfwheel reports.
  description: 5th Avenue Products Trading, the exclusive Habanos distributor for
    Germany, Austria and Poland, is in formal insolvency proceedings; its administrator
    blames EU sanctions, and a restart of distribution is not in sight.
