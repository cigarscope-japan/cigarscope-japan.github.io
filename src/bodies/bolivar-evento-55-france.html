<p class="article-caption">写真：Cigars-connect — フランス向け地域限定のキャビネット</p>
<div class="article-body">
<p>フランス向けエディシオン・レヒオナル2025「ボリバ エベント55」が、フランス国内のタバコ店に到着しました。Cigars-connectが報じました。</p>
<p>サイズはヘニオス型（140mm×52）。50本入りキャビネット4,000個（計20万本）の限定生産で、価格は1本35ユーロです。</p>
<p>併せて、シガリロ「コイーバ ワイド・ショート」50本入りの限定箱（340ユーロ、21,000箱）も発売されました。販売店コプロバの発表です。</p>
</div>
