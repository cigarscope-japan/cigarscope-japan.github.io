<p class="article-caption">写真：Halfwheel — メキシコ向け地域限定の箱</p>
<div class="article-body">
<p>メキシコ向けエディシオン・レヒオナル（地域限定品）の第6弾として、「フアン・ロペス ベサメ・ムーチョ」が発売されました。Halfwheelによると、4月24日の発売イベントを経て、25日に販売が始まりました。販売店IEPTの発表です。</p>
<p>「ベサメ・ムーチョ」はラテン音楽の名曲のタイトルを冠した製品で、サイズはスブリメス型（164mm×54）。価格は約1,066メキシコペソ（約60ドル）とされています。</p>
</div>
