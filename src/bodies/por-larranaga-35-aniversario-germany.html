<p class="article-caption">写真：Halfwheel — 5thアベニュー35周年記念の地域限定</p>
<div class="article-body">
<p>ドイツ向けエディシオン・レヒオナル「ポル・ララニャガ 35アニベルサリオ」が、8月31日にドイツのラ・カーサ・デル・ハバノと専門店で発売されました。Halfwheelが報じました。独・墺・ポーランド向け販売店5thアベニュー（5タ・アベニーダ）の創業35周年を祝う記念品です。</p>
<p>サイズは194mm×49。50本箱1,750ユーロで、生産は10万本限定とされています。</p>
<p>なお5thアベニューはその後11月に破産手続きに入っており、この記念品は破産前の最後の大型発売となりました。</p>
</div>
