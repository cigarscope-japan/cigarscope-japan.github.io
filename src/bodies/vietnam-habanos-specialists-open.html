<p class="article-caption">写真：Habanos S.A. — ホーチミン／ニャチャンの新店舗</p>
<div class="article-body">
<p>ベトナムのホーチミン市とニャチャンに、ハバノス・スペシャリスト（専門店）が新たに開店しました。ハバノスS.A.の公式発表によるもので、これでベトナム国内のスペシャリストは計14店舗となりました。</p>
<p>ホーチミン市の店舗は3フロア・400㎡で、サイゴン川を見渡すテラスを備えます。ニャチャンの店舗は中部最大となる500㎡超。展開はアバンティ・グループと現地販売店ゴールデン・フェニックスによるものです。</p>
</div>
