<p class="article-caption">写真：Cigars-connect — 6年越しに発売された「エレデロス」</p>
<div class="article-body">
<p>モンテクリストの「エレデロス」が、スイスのラ・カーサ・デル・ハバノで発売されました。Cigars-connectによると発売は7月21日から。エレデロスは2020年のフェスティバル・デル・ハバノで発表されながら、コロナ禍で消えたと思われていた製品で、6年越しの実売開始となります。</p>
<p>サイズは162mm×47、価格は1本CHF 59。併せて、トリニダード・ビジャ（CHF 75）と、免税専売だったコイーバ・ビストソス（CHF 260）も一般発売されました。いずれもLCDH・専門店専売です。</p>
</div>
