<p class="article-caption">写真：Habanos S.A. — カンヌTFWAで発表された「フラガータ」</p>
<div class="article-body">
<p>モンテクリストの新ビトラ「フラガータ」が、9月29日にカンヌで開かれたTFWA（免税・旅行小売の国際展示会）で発表されました。ハバノスS.A.の公式発表によるものです。</p>
<p>フラガータはデューク型（54×140mm）。20本入りトラベルヒュミドール（加湿器・湿度計付き）での販売で、価格は1,280ドル。免税・トラベルリテール専売の製品です。</p>
<p>発売時期は未定とされています。</p>
</div>
