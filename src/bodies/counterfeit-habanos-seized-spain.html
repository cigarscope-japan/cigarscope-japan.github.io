<p class="article-caption">写真：Cigar Journal — バレンシア近郊での押収現場</p>
<div class="article-body">
<p>スペインの治安警備隊（グアルディア・シビル）が、バレンシア近郊ミスラタの住宅で、偽物のキューバ葉巻33,840本を押収しました。Cigar Journalが報じました。</p>
<p>現場では、偽バンドの装着と、欧州各地へ流通させるための梱包が行われていたとされています。高額化が進むキューバ葉巻を狙った偽造が、欧州の流通網に入り込む手前で摘発された形です。</p>
