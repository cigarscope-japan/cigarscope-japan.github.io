<div class="article-body">
<p>葉巻専門誌「シガー・アフィショナード」の創刊者で編集・発行人を務めたマービン・R・シャンケン氏が83歳で亡くなりました。1990年代の葉巻ブームを牽引し、葉巻を世界のラグジュアリー文化に押し上げた立役者として、業界に大きな足跡を残しました。（人物写真は本紙の掲載方針により載せていません。）</p>
