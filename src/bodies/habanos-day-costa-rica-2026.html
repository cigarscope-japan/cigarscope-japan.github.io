<p class="article-caption">写真：Habanos S.A. — 第5回ハバノス・デーの会場風景</p>
<div class="article-body">
<p>5月16日、コスタリカで第5回ハバノス・デーが開催されました。ハバノスS.A.の公式発表によると、参加者は100人を超えました。主催は中米の販売店クルス・カネラです。</p>
<p>会場では、創設60周年のコイーバ（シグロI／III）のほか、30周年を迎えるクアバとベゲーロスが振る舞われました。</p>
</div>
