<p class="article-caption">写真：Cigar Journal — 160周年記念版の箱</p>
<div class="article-body">
<p>オヨ・デ・モンテレイの創設160周年を記念する限定版が、スペイン市場専売で発売されました。Cigar Journalが報じました。</p>
<p>ベースとなったのは「Le Hoyo de Río Seco」で、サイズは工場名アロモソス（140mm×56）。グローバルブランドの大型周年記念品が、スペイン専売という形で登場しました。</p>
</div>
