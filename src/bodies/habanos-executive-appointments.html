<p>ハバノス社はこの秋、幹部人事を相次いで発表しました。9月23日に商業担当副社長、9月30日に運営マーケティング部長、10月21日に品質部長がそれぞれ就任しています。ドイツの流通停止など供給網が揺れる中での体制づくりとして注目されます。</p>
