<p class="article-caption">写真：Cigar Journal — スイス地域限定2023「インテンポラレス」</p>
<div class="article-body">
<p>スイス向けエディシオン・レヒオナル2023「ポル・ララニャガ インテンポラレス」について、発売が6月になるとハバノスが発表しました。Cigar Journalが6月15日に伝えました。</p>
<p>2023年銘の地域限定品が2026年になって実売される形で、近年のハバノスの供給遅延を象徴するケースと言えます。なお、サイズ・価格などの詳細は同誌の要旨からは確認できていません。</p>
