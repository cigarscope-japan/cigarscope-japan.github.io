<p class="article-caption">写真：Cigars-connect — キューバのタバコ産地</p>
<div class="article-body">
<p>キューバの国民議会が6月19日に採択した176項目の経済改革パッケージのうち、3つの措置がタバコ産業に直結します。Cigars-connectが報じました。</p>
<p>具体的には、民間法人への農地用益権（無期限）の付与や、燃料・再生可能エネルギー設備の直接輸入が認められます。生産現場の資材調達の自由度が上がる内容です。</p>
<p>一方で、タバクーバによる葉の買い付け独占と、ハバノスによる販売独占は変わりません。そのため専門家の評価は慎重で、改革の実効性は今後の運用にかかっています。</p>
</div>
