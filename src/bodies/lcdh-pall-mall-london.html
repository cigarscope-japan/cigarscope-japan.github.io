<p class="article-caption">写真：Dominique London／Cigars-connect — ロンドン・パルマルの旗艦店外観</p>
<div class="article-body">
<p>3月25日、ロンドン中心部セントジェームズのパルマル26番地に、ラ・カーサ・デル・ハバノの旗艦店が開店しました。Cigars-connectが報じました。運営はドミニク・ロンドンと唐タバコの共同によるものです。</p>
<p>創業者が「最高傑作」と呼ぶ店舗で、ウォークインヒュミドール2室と喫煙ラウンジを備えます。開店パーティは4回にわたって開かれました。</p>
</div>
