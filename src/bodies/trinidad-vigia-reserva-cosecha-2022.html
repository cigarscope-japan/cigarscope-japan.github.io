<p class="article-caption">写真：Habanos S.A. — トリニダード初のレセルバ</p>
<div class="article-body">
<p>トリニダード史上初となるレセルバ「ビヒア レセルバ コセチャ2022」が発表されました。ハバノスS.A.の公式発表によると、9月19日にスイス・モントルーで世界初披露が行われました。</p>
<p>サイズはビヒア型（54×110mm）で、最低3年追加熟成させた葉を使用。20本箱（3,800ドル）は5,000箱の番号入り限定生産で、3本入りギフト箱（660ドル）も同数用意されます。</p>
<p>特徴的なのは、バンドにNFC認証チップを搭載している点です。真贋確認の仕組みを製品自体に組み込んだ形となります。</p>
</div>
