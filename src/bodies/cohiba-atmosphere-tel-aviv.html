<p class="article-caption">写真：Cigar Journal — テルアビブのラウンジ内観</p>
<div class="article-body">
<p>イスラエルのテルアビブに、コイーバ・アトモスフィア「Cohiba Atmosphere TLV」がオープンしました。Cigar Journalが伝えました。高級ホテル「ザ・デビッド・ケンピンスキー テルアビブ」内の施設です。</p>
<p>コイーバ・アトモスフィアはコイーバ専用のラウンジブランドで、テルアビブの施設はイスラエル初。同国におけるキューバ葉巻の公式拠点と位置付けられています。</p>
