<p class="article-caption">写真：Habanos S.A. — スイス11店目の開店風景</p>
<div class="article-body">
<p>6月26日、スイス北東部クロイツリンゲンに、ラ・カーサ・デル・ハバノが開店しました。ハバノスS.A.の公式発表によると、スイス国内では11店目となります。</p>
<p>クロイツリンゲンはボーデン湖畔、ドイツ国境に近い町です。運営はザンクト・ガレン店で知られるポートマン家で、店内には喫煙ラウンジを備えています。</p>
</div>
