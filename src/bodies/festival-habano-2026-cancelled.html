<p class="article-caption">イラスト：AI生成 — ハバナの劇場前（イメージ図）</p>
<div class="article-body">
<p>2月に延期が発表されていた第26回フェスティバル・デル・ハバノについて、組織委員会が7月20日、「今年は開催しない」と正式に発表しました。ハバノスS.A.の公式声明によるものです。</p>
<p>中止の理由は、キューバのエネルギー危機を含む国内情勢とされています。フェスティバルの中止はコロナ禍の年を除けば異例のことで、キューバ葉巻最大の発表の場が失われる年となりました。</p>
<p>一方で、コイーバ創設60周年の記念プログラムについては、世界各地で継続するとしています。</p>
