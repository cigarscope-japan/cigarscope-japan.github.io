<p class="article-caption">写真：Cigar Journal — ボゴタの新スペシャリスト店舗</p>
<div class="article-body">
<p>コロンビアの首都ボゴタに、ハバノス・スペシャリスト「The Cigar Humidor」が開店しました。Cigar Journalが報じました。店舗面積は172㎡で、スペシャルティコーヒー店Sacovillaと併設されています。</p>
<p>経営者のデビッド・モンローは、コロンビア初のスペシャリスト認定店の共同創業者でもあります。同国では偽物が横行していた市場が、現地販売店カリベ・インポーツの取り組みによって、正規専門店を中心とした市場へ変わりつつあると伝えられています。</p>
</div>
