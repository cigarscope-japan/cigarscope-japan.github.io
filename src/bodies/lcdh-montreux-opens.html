<p class="article-caption">写真：Habanos S.A. — スイス10店目となるモントルー店の開店風景</p>
<div class="article-body">
<p>3月19日、スイス・モントルーの5つ星ホテル「フェアモント・モントルー・パレス」内に、ラ・カーサ・デル・ハバノが開店しました。ハバノスS.A.の公式発表によると、スイス国内では10店目となります。</p>
<p>5つ星ホテル内への出店はスイスでは初めてのフランチャイズ形態で、運営はモンバロン家が担います。レマン湖畔のモントルーに開店し、開店式にはキューバ大使も出席しました。</p>
</div>
