const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const moreEl = document.getElementById('more');
const LIMIT = 200;
function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function card(it){
  const unitHasMm = it.unit && it.mm && it.unit.startsWith(it.mm + 'mm');
  const spec = [(!unitHasMm && it.mm) ? it.mm + 'mm' : '', it.rg ? 'RG ' + it.rg : '', it.vitola, it.unit].filter(Boolean).join(' ／ ');
  const price = [];
  const yen = v => /^\d+$/.test(v) ? '¥' + Number(v).toLocaleString() : v;
  if (it.listprice) price.push('認可定価 <b>' + esc(yen(it.listprice)) + '</b>');
  if (it.price) price.push('販売価格 <b>' + esc(yen(it.price)) + '</b>');
  const meta = [it.maker, it.country].filter(Boolean).join(' ／ ')
    + (it.importer ? '<br>輸入元：' + esc(it.importer) : '')
    + (it.shop ? '<br>販売店：' + esc(it.shop) : '')
    + (it.date ? '<br>確認日：' + esc(it.date) : '');
  const sold = it.sold && it.sold !== 'なし';
  const badges = '<span class="badge' + (it.approved.startsWith('あり') ? '' : ' gray') + '">認可：' + esc(it.approved) + '</span>'
    + '<span class="badge' + (sold ? '' : ' gray') + '">販売確認：' + (sold ? 'あり' : 'なし') + '</span>'
    + (it.status ? '<span class="badge gray">' + esc(it.status) + '</span>' : '');
  return '<div class="card"><div class="noimg">NO<br>IMAGE</div><div>'
    + '<div class="brand">' + esc(it.brand) + '</div>'
    + '<h2>' + esc(it.name) + '</h2>'
    + (spec ? '<div class="spec">' + esc(spec) + '</div>' : '')
    + (price.length ? '<div class="price">' + price.join('　') + '</div>' : '')
    + '<div class="meta">' + meta + '</div>'
    + '<div class="badges">' + badges + '</div>'
    + '</div></div>';
}
function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const fb = document.getElementById('fbrand').value;
  const fc = document.getElementById('fcountry').value;
  const fs = document.getElementById('fstatus').value;
  const hits = DATA.filter(it => {
    if (fb && it.brand !== fb) return false;
    if (fc && it.country !== fc) return false;
    if (fs && it.status !== fs) return false;
    if (q && !(it.brand + ' ' + it.name + ' ' + it.maker).toLowerCase().includes(q)) return false;
    return true;
  });
  countEl.textContent = hits.length.toLocaleString() + '銘柄';
  listEl.innerHTML = hits.slice(0, LIMIT).map(card).join('');
  moreEl.textContent = hits.length > LIMIT ? '上位' + LIMIT + '銘柄を表示しています。検索や絞り込みで探してください。' : '';
}
['q','fbrand','fcountry','fstatus'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});
render();
