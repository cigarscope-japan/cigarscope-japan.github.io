<p class="article-caption">写真：Cigar Journal — クアラルンプール店の1周年イベント</p>
<div class="article-body">
<p>マレーシアのラ・カーサ・デル・ハバノ・クアラルンプールが、5月に開店1周年を迎えました。Cigar Journalが伝えました。同店は2025年に開店した「新しい」LCDHです。</p>
<p>記念イベントにはパシフィック・シガーの関係者らが招かれました。アジア市場におけるLCDH網の定着を示す一件です。</p>
