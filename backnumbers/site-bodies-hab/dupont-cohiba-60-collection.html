<p class="article-caption">写真：Cigars-connect — デュポンの60周年コレクション第1弾</p>
<div class="article-body">
<p>コイーバ創設60周年を記念する、ハバノスとS.T.デュポンのコレクション第1弾が6月8日に発売されました。Cigars-connectが報じました。</p>
<p>中心はライター3種で、価格は690〜2,300ユーロ。いずれもコイーバ創設年の1966年にちなみ、各1,966個限定です。ほかにもカッターや灰皿などがラインナップされています。</p>
<p>例年、この種の記念コレクションはフェスティバル・デル・ハバノで披露されますが、今年はフェスティバルが中止となったため、単独での発表となりました。第2弾は11月に予定されています。</p>
</div>
