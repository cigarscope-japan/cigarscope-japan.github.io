<p class="article-caption">写真：Cigars-connect — BHK 58を含む記念セレクション箱</p>
<div class="article-body">
<p>コイーバ・ベイケの新サイズ「BHK 58」が、2月3日にスイスのラ・カーサ・デル・ハバノで発売されました。Cigars-connectが報じました。2025年のフェスティバル・デル・ハバノで発表されていた、ベイケ最大かつ最高額のサイズ（178mm×58）です。</p>
<p>発売形態は、ベイケ15周年記念セレクション箱。BHK 52／54／56／58の4本入りで、価格はCHF 1,696。2月10日からは専門店でも取り扱いが始まりました。</p>
<p>なお8月には、フランスでの公式価格が1本370ユーロと報じられています。</p>
</div>
