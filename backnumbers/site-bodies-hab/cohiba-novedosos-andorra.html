<p class="article-caption">写真：Cigars-connect — LCDH専売「ノベドソス」のケース</p>
<div class="article-body">
<p>コイーバの「ノベドソス」が、アンドラで本格的に販売開始されました。Cigars-connectが報じました。ノベドソスは2019年に発表されたLCDH・専門店専売品ですが、コロナ禍の影響でほぼ流通しないままになっていました。</p>
<p>サイズは156mm×50、価格は25本箱で5,350ユーロ。今回のアンドラでの販売は、世界的にもほぼ初の実物流通とされています。</p>
