<p class="article-caption">写真：Cigar Journal — 60周年を迎えたコイーバ</p>
<div class="article-body">
<p>ハバノスは、フラッグシップブランドであるコイーバの創設60周年を2026年の中心テーマに据え、「コイーバ・イヤー」として年間を通じた記念展開を行います。Cigar Journalの業界特集が伝えました。</p>
<p>例年、周年企画の中心はフェスティバル・デル・ハバノでしたが、2026年はフェスティバルが中止となり、例年の発表の場を失いました。その分、60周年の記念企画は世界各地のイベントへ分散して展開していく流れになっています。</p>
</div>
