<p class="article-caption">写真：Cigar Journal — ブラジル向け地域限定第3弾の箱</p>
<div class="article-body">
<p>ブラジル向けエディシオン・レヒオナル（地域限定品）の第3弾「ラ・グロリア・クバーナ セリエ・ブラジル No.3」が、現地の主要店舗で発売されました。Cigar Journalが報じました。</p>
<p>サイズはカンパーナ型（52×140mm）。番号入りの10本箱6,000個限定で、現地価格は1箱平均490ユーロとされています。製品は2025年のハバノス・ナイトで披露されていたものです。</p>
<p>この発売をもって、ラ・グロリア・クバーナのブランド自体が、正規販売店エンポリウム・シガーズによってブラジル市場へ初めて導入されました。</p>
</div>
