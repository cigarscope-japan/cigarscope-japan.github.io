<p class="article-caption">写真：Cigar Journal — ワイド・ショート初の限定ヒュミドール</p>
<div class="article-body">
<p>ミニシガリロ「コイーバ・ワイド・ショート」初の限定版として、50本入り限定ヒュミドール「Cohiba Wide Short 50 Limited Edition 2024」が登場しました。Cigar Journalが製品単独記事として伝えました。</p>
<p>ワイド・ショートについては、フランスで50本入りの限定箱（340ユーロ、21,000箱）が発売されるなど、シガリロの枠を超えた限定展開が進んでいます。</p>
