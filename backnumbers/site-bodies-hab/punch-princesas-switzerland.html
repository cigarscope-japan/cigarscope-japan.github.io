<p class="article-caption">写真：Cigars-connect — エディシオン・リミターダ2025「プリンセサス」</p>
<div class="article-body">
<p>パンチの創業185周年を記念するエディシオン・リミターダ2025「プリンセサス」が、2月3日にスイスで発売されました。Cigars-connectが報じました。ベイケBHK 58と同じ日の発売です。</p>
<p>プリンセサスは135mm×52のサイズで、価格は1本CHF 52（約56ユーロ）。製品の発表自体は2025年12月のハバノス公式発表で行われており、2026年に入って実際の販売が始まりました。</p>
</div>
