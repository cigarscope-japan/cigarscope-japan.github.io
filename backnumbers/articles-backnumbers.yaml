  title: Big Smoke ラスベガス30周年 — 本日が2日目、ガイ・フィエリが登壇
  summary: Cigar Aficionado 主催の「Big Smoke ラスベガス」が今年で30周年を迎え、11月6日（金）・7日（土）の2日間、ラスベガスのホースシュー・ラスベガスで開かれています。本日7日はセミナー当日。セミナーはすでに満席で、約600人が参加します。目玉は、テレビ料理番組で知られ、エスピノサと「ナックル・サンドイッチ」を手がけるガイ・フィエリのインタビュー。セミナー参加者には、2025年の年間最優秀葉巻に選ばれたパドロン「60th Anniversary Perfecto」（97点、1本75ドル＝約11,880円）をホルヘ・パドロン本人が紹介するほか、タトゥアヘ「ブラック プティ・ランセロ」（第3位）、クエスタ・レイ「セントロ・フィノ サングロウン ピラミッド No.9」（第4位）の試喫も用意されています。夜の部では25本以上のプレミアム葉巻が振る舞われます。30周年を記念したパネルでは、リット・ゴメス（ラ・フロル・ドミニカーナ）、ホセ・オリバ（オリバ・シガー）、ロッキー・パテルが業界の30年を振り返ります。なおフィエリとエスピノサは、ドミニカ共和国に葉巻工場を共同で開く計画も進めているとのことです。
