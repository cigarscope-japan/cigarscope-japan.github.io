- slug: oliva-melanio-anio-2026
  title: オリバ「セリエV メラニオ エディシオン・アーニョ 2026」店頭に到着 — ペルフェクト型の異形ビトラ、9,000箱限定
  summary: オリバの年次限定ビトラ「エディシオン・アーニョ」の2026年版が、11月2日に米国の店頭へ到着しました。上半分は通常のパレホ、下半分が鋭くテーパーしたペルフェクト型で、2017年以降の同シリーズでも異色の形状。2013年の135周年記念限定品に似たシルエットです。ラッパーはエクアドル産スマトラ種で、内側には温暖多雨だった2023〜24年産ハラパ（ニカラグア）の葉を使用。オリバはこの収穫をワインのグラン・クリュになぞらえています。親会社ヴァンデルマリエール・シガー・ファミリーのフレッド・ヴァンデルマリエールCEOは「メラニオはすでに最高の最高。だがこの限定品は、自然からしか与えられない特別な条件によって、その体験を夢のようなレベルへ引き上げる」と述べています。9,000箱のうち5,000箱は米国以外の市場へ向けられます。
