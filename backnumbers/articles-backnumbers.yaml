- slug: stg-hoyo-epicure-delisting
  title: STG、Hoyo「エピキュア・セレクシオン」など11品目を価格表から削除 — 値上げはほぼなし
  summary: スカンジナビアン・タバコ・グループ（STG）が小売店向けに新しい価格表を送付しました。例年なら値上げの合図ですが、今回は数セントの微調整にとどまる一方、ジェネラル・シガー社の価格表から11品目が削除されました。目立つのは、2020年に登場した米国向けホヨ・デ・モンテレイ「エピキュア・セレクシオン」（ホンジュラス産の独自種ラッパーが特徴）の3サイズ全て。あわせて、8月にSTGとの販売契約を終えたマイアミの小規模工場エル・ティタン・デ・ブロンセのニカラグア・ライン、ドン・トマスやエクスカリバー・ブラックの一部なども外れました。なお価格表から外れても、大手カタログ店やSTG直営の小売り経路では引き続き販売される場合があるとのことです。なお、これは米国のホヨ・デ・モンテレイで、キューバ産のホヨ・デ・モンテレイとは別物です。
