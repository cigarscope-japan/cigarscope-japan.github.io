  summary: 米フラテッロ・シガーズ（Fratello Cigars）が、スウェーデンのカインド・シガーズ（Kind Cigars）と販売契約を結び、同国市場への供給を始めます。カインド・シガーズはマーティン・ネルソンが2011年に創業した輸入販売会社で、複数の葉巻メーカーを扱っています。両者は見本市InterTabacでの出会いをきっかけに意気投合したとのこと。フラテッロの創業者オマル・デ・フリアスは「スウェーデンには欧州でも指折りの、知識と熱意を持つ愛好家がいる」とコメントしました。同社の販売網はオランダ、スペイン、タイ、スイス、ドイツ、英国など約30の国・地域に広がっており、欧州での存在感が一段と増しています。
