  summary: 米J.C. Newmanが、傘下の老舗ブランド「クエスタ・レイ（Cuesta-Rey）」のバンドデザイン刷新を発表しました。新バンドは11月7日、Cigar Aficionado主催のイベント「Big Smoke Las Vegas」のセミナーでお披露目されます。クエスタ・レイは1884年、アンヘル・ラマドリッド・クエスタとペレグリーノ・レイが創業し、スペイン王アルフォンソ13世の公式葉巻にもなった歴史を持ちます。現在の葉巻はドミニカ共和国のタバカレラ・A・フエンテが製造。新しいバンドは伝統を受け継ぎながら、王冠とCRモノグラムの現代的な意匠に生まれ変わります。
