  title: クラウン・ヘッズ「ラス・カラベラス デシモ 2026」— 人気限定が3サイズで復活、10月30日に出荷開始
  summary: テネシー州のクラウン・ヘッズが、2024年に「ラス・カラベラス」シリーズの10周年を記念して出した限定品「デシモ・アニベルサリオ」を、2026年版として復活させました。2024年は6×52のトロ1サイズのみでしたが、2026年版は3サイズに拡大。エクアドル産ハバノ・オスクロのラッパーにオール・ニカラグアのブレンドで、製造はニカラグアのマイファザー・シガーズです。パッケージは緑を基調に刷新されました。10月30日に小売店への出荷が始まっています。「ラス・カラベラス」はメキシコの死者の日をしのぶシリーズで、デシモのブレンドは初代2014年の限定品に遡るとのことです。
