- slug: dunbarton-shokai-bushido
  title: ダンバートン「Shokai Bushido」— 11月14日のCigartopiaでデビュー、サカの新ブレンド「匠」の試作から誕生
  summary: ダンバートン・タバコ＆トラストの創業者スティーブ・サカが、新作「Shokai Bushido（ショウカイ・ブシドー＝武士道への入門）」を11月14日（土）、アリゾナ州フェニックスのシガーズ・デイリー本社で開かれるイベント「Cigartopia 2026」で初披露します。シガー・ドージョウとのコラボレーションによる一回限りの限定品で、イベント会場での対面販売が先行し、残りがあればシガーズ・デイリーのサイトで販売されます。エクアドル産スマトラ種のラッパーを使い、サカが約3年かけて取り組んできた新ブレンド「匠（Takumi）」の開発から生まれた葉巻です。価格やサイズ、生産本数、製造工場はまだ発表されていません。サカは「匠」についても、2027年3月のPCA見本市で披露する可能性がある極小ロットのブレンドだとしています。
