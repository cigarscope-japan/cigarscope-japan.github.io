- slug: selected-tobacco-madrid-hq
  title: Selected Tobacco、マドリードに5階建ての新拠点を開設 — 半世紀ぶりのマドリードでの葉巻製造
  summary: アタベイやバイロンで知られる Selected Tobacco が、スペイン・マドリードに5階建ての新拠点を開設し、10月10〜11日の週末にグランドオープンを祝いました。マドリード・バラハス空港近くの約3,000平方メートルの施設で、1階は受付・倉庫・アートギャラリー、2階はデザイン・包装、3階は巻き場（ガレラ）と熟成室、4階は熟成室・執務室・ショールーム、5階は会員制ラウンジとテラス。裏手では発酵と水耕栽培の実験室も備えます。創業者のネルソン・アルフォンソによれば、マドリードでプレミアム葉巻の製造拠点が開かれるのは50年以上ぶり。10月11日のガラには約250〜300人が集まりました。当面、葉巻の巻き上げはコスタリカのタバコス・デ・コスタリカに委託し、完成品をマドリードでさらに熟成させる体制ですが、3階のガレラでは6組のトルセドールが巻き始め、将来的には年間50万本をスペインで巻く目標です。
