  summary: ドイツ・ドルトムントで開かれる世界最大級のタバコ産業見本市InterTabacと、併催のNUBIZ、InterSupplyが2026年大会を振り返り、2027年大会に向けた準備を本格化させています。主催側によれば、出展社の90%以上が2027年の再出展を計画しているとのこと。2027年大会は9月14〜16日、メッセ・ドルトムントで開催されます。葉巻メーカー各社が新作や提携を披露する場であり、先のフラテッロのスウェーデン進出もこの見本市での出会いがきっかけでした。業界の景況と人の流れを映すイベントとして、来年も注目です。
