- slug: domain-cigars-test-blend-portal
  title: Domain Cigars、試作ブレンドを店と客の声で育てる「テストブレンド・ポータル」
  summary: 新興ブランドのDomain Cigarsが、旗艦小売店向けに「テストブレンド・ポータル」を開設しました。ブレンダーのエステバン・ディスラとケビン・バクスターが生んだ試作ブレンドを旗艦店に配り、店と顧客が実際に吸って、香りの印象や構造、燃焼の具合といったフィードバックと、100点満点の個人評価をポータルに記録する仕組みです。寄せられた声はブレンダー本人に直接届き、次の製品開発に反映されます。共同創業者のダニエル・ランスは「派手な発売はない。この葉巻たちが製品化される保証もない。工場の中で起きていることを体験し、作り手に声を届ける機会だ」と述べています。製品化前のブレンドを顧客と一緒に育てる、ブティック時代らしい試みです。
