- slug: san-luis-rey-eiroa-30th-maduro
  title: サン・ルイス・レイ エイロア 30周年「マデューロ」登場 — TAA会員店に11月中旬から出荷
  summary: アルタディスUSAとC.L.E.シガー社のクリスチャン・エイロアによる記念ライン「サン・ルイス・レイ エイロア 30周年」に、より濃厚なマデューロ版が加わります。エクアドル産ハバノ・マデューロのラッパー、ホンジュラス産コロホのバインダー、コロンビア産ピナレーニョとホンジュラス産コロホのフィラー。原版は、エイロアが1996年に手がけたホンジュラス産サン・ルイス・レイの再現を目指して2026年4月のPCA見本市で発表されたものです。マデューロ版は10月下旬のTAA（全米葉巻商協会）会合でお披露目され、TAA会員店へ11月中旬に出荷、一般の実店舗へは2027年3月のPCA見本市までに供給される予定です。実店舗限定の販売で、製造はホンジュラス・ダンリのC.L.E.工場です。
